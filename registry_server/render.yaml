# Render Blueprint for Smart Parking Registry
# This file configures the deployment on Render.com

services:
  - type: web
    name: smart-parking-registry
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REGISTRY_API_KEY
        generateValue: true
      - key: REGISTRY_PUBLIC_URL
        sync: false  # Set this after deployment to the Render URL
      - key: DATABASE_PATH
        value: /data/registry.db
    disk:
      name: registry-data
      mountPath: /data
      sizeGB: 1
