<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Parking Slot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.5s ease;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            transition: box-shadow 0.5s ease;
        }

        .btn-verify {
            background-color: #28a745;
            color: white;
            border-radius: 25px;
            padding: 10px 20px;
            font-weight: bold;
        }

        .btn-verify:hover {
            background-color: #218838;
            color: white;
        }
    </style>
</head>

<body>
    <div class="card p-4">
        <h3 class="text-center mb-4">Verify Parking</h3>
        <p class="text-center text-muted">Slot ID: <strong>{{ slot_id }}</strong></p>

        <form id="verifyForm">
            <input type="hidden" name="slot_id" value="{{ slot_id }}">
            <div class="mb-3">
                <label for="reg_num" class="form-label">Vehicle Registration Number</label>
                <input type="text" class="form-control" id="reg_num" name="reg_num" placeholder="e.g., MH02AB1234"
                    required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-verify">Verify Now</button>
            </div>
        </form>
        <div id="message" class="mt-3 text-center"></div>
    </div>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);

            fetch('/process_verification', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    const msgDiv = document.getElementById('message');
                    if (data.success) {
                        msgDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                        setTimeout(() => {
                            window.close(); // Attempt to close window
                            msgDiv.innerHTML += '<p>You can close this tab.</p>';
                        }, 2000);
                    } else {
                        msgDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                        if (data.alert) {
                            // Turn screen red on alert
                            document.body.style.backgroundColor = '#ef4444';
                            document.querySelector('.card').style.boxShadow = '0 0 30px rgba(0,0,0,0.5)';
                        }
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('message').innerHTML = `<div class="alert alert-danger">An error occurred.</div>`;
                });
        });
    </script>
</body>

</html>
